<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director - Farreras Nadal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --teal: #2E7E82;
      --teal-light: #E0F2F1;
      --teal-dark: #1B4F52;
      --amber: #F59E0B;
      --amber-light: #FEF3C7;
      --grey-50: #F9FAFB;
      --grey-100: #F3F4F6;
      --grey-200: #E5E7EB;
      --grey-400: #9CA3AF;
      --grey-600: #4B5563;
      --grey-700: #374151;
      --red: #EF4444;
      --green: #10B981;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--grey-100);
      color: var(--grey-700);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border-top: 4px solid var(--teal-dark);
    }

    .header-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--teal);
    }

    .counter {
      background: var(--amber-light);
      color: var(--amber);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* PESTAÑAS */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .tab-btn {
      padding: 10px 25px;
      background: var(--grey-200);
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--teal);
      color: white;
      border-color: var(--teal-dark);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    /* TAB CONTENT */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* BUSCADOR */
    .search-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--grey-200);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-light);
    }

    /* CONSULTA CARD */
    .consulta-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border-left: 4px solid var(--teal);
    }

    .consulta-header {
      background: var(--grey-100);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      gap: 15px;
      flex-wrap: wrap;
    }

    .consulta-header:hover {
      background: var(--grey-200);
    }

    .consulta-id {
      font-weight: 700;
      color: var(--teal);
      font-size: 1.1rem;
      min-width: 50px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-eliminar {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-eliminar:hover {
      background: #DC2626;
      transform: scale(1.05);
    }

    .toggle-icon {
      color: var(--grey-600);
      font-weight: 700;
    }

    .consulta-body {
      padding: 20px;
      display: none;
    }

    .consulta-body.expanded {
      display: block;
    }

    .datos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .datos-grid.full {
      grid-template-columns: 1fr;
    }

    .dato-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--grey-200);
    }

    .dato-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--grey-600);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .dato-valor {
      font-weight: 500;
      color: var(--grey-700);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--teal);
      color: white;
    }

    .btn-primary:hover {
      background: var(--teal-dark);
    }

    .btn-print {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid var(--amber);
    }

    .btn-print:hover {
      background: var(--amber);
      color: white;
    }

    .btn-asignar {
      padding: 8px 16px;
      background: var(--teal-light);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-asignar:hover {
      background: var(--teal);
      color: white;
    }

    .assignacio-section {
      background: var(--teal-light);
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }

    .assignacio-label {
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 10px;
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--grey-500);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .datos-grid {
        grid-template-columns: 1fr;
      }

      .consulta-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        margin-top: 10px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .tabs,
      .search-box,
      header,
      .btn-group,
      .btn-eliminar,
      .header-actions {
        display: none !important;
      }

      .consulta-card {
        page-break-inside: avoid;
        border: 1px solid var(--grey-300);
      }

      .consulta-body {
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header>
      <div>
        <div class="header-brand">👨‍💼 Farreras Nadal</div>
        <div style="margin-top: 10px;">
          <span style="color: var(--teal); font-weight: 600;">Panel Director</span>
          <span class="counter" id="contador">0 pendents</span>
        </div>
      </div>
    </header>

    <!-- PESTAÑAS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="mostrarTab('sin-asignar')">
        🔴 Sin asignar
      </button>
      <button class="tab-btn" onclick="mostrarTab('assignades')">
        ✅ Assignades
      </button>
    </div>

    <!-- TAB 1: SIN ASIGNAR -->
    <div id="sin-asignar" class="tab-content active">
      <div class="search-box">
        <input 
          type="text" 
          id="buscador-sin-asignar" 
          placeholder="🔍 Cerca per: Referència, Comercial, Client o ID..." 
          lang="ca"
          onkeyup="filtrar('sin-asignar')"
        >
      </div>
      <div id="lista-sin-asignar"></div>
    </div>

    <!-- TAB 2: ASSIGNADES -->
    <div id="assignades" class="tab-content">
      <div class="search-box">
        <input 
          type="text" 
          id="buscador-assignades" 
          placeholder="🔍 Cerca per: Referència, Comercial, Client o ID..." 
          lang="ca"
          onkeyup="filtrar('assignades')"
        >
      </div>
      <div id="lista-assignades"></div>
    </div>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyGDLmEpL15VaolO6c4GjlmcZVERuG4zU6u_sO4BMLq8B9y4Nm3GD5uwK2CbJZBoKfZbQ/exec';
    let todasLasConsultes = [];
    let consultasOcultas = JSON.parse(localStorage.getItem('consultasOcultas')) || [];

    // CARGAR CONSULTES
    async function cargarConsultes() {
      try {
        const response = await fetch(`${URL_SCRIPT}?correu=director`);
        const datos = await response.json();
        
        if (!Array.isArray(datos)) {
          throw new Error('Respuesta no es un array: ' + JSON.stringify(datos).substring(0, 100));
        }

        todasLasConsultes = datos.sort((a, b) => {
          const dateA = new Date(a['Data entrada'] || '');
          const dateB = new Date(b['Data entrada'] || '');
          return dateB - dateA;
        });

        console.log('✅ Consultes cargadas:', todasLasConsultes.length);
        actualizarVistas();
      } catch (error) {
        console.error('❌ Error cargando:', error);
        document.getElementById('lista-sin-asignar').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div>Error: ${error.message}</div>`;
        document.getElementById('lista-assignades').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div>Error: ${error.message}</div>`;
      }
    }

    // ACTUALIZAR VISTAS
    function actualizarVistas() {
      const sinAsignar = todasLasConsultes.filter(c => !c['Assignat a'] || c['Assignat a'] === '');
      const assignades = todasLasConsultes.filter(c => c['Assignat a'] && c['Assignat a'] !== '').filter(c => !consultasOcultas.includes(c['ID']));

      document.getElementById('contador').textContent = `${sinAsignar.length} sin asignar, ${assignades.length} assignades`;

      mostrarConsultes('sin-asignar', sinAsignar);
      mostrarConsultes('assignades', assignades);
    }

    // MOSTRAR CONSULTES
    function mostrarConsultes(tab, consultes) {
      const lista = document.getElementById(`lista-${tab}`);

      if (consultes.length === 0) {
        lista.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div>No hi ha consultes</div>`;
        return;
      }

      const esAssignada = tab === 'assignades';

      lista.innerHTML = consultes.map(c => `
        <div class="consulta-card">
          <div class="consulta-header" onclick="toggleExpandir(this)">
            <div style="flex: 1;">
              <div style="display: flex; gap: 15px; align-items: baseline; flex-wrap: wrap;">
                <span style="font-weight: 600; color: var(--grey-700);">${c['Nom comercial'] || '-'}</span>
                <span style="color: var(--grey-600);">→</span>
                <span style="font-weight: 600; color: var(--grey-700);">${c['Nom client']}</span>
                <span style="color: var(--grey-500); font-size: 0.9rem;">[${c['Referència'] || '-'}]</span>
              </div>
            </div>
            <div class="header-actions">
              ${esAssignada ? `
                <div style="background: var(--teal-light); color: var(--teal); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-right: 10px;">
                  👤 ${c['Assignat a'].charAt(0).toUpperCase() + c['Assignat a'].slice(1)}
                </div>
              ` : ''}
              ${esAssignada ? `<button class="btn-eliminar" onclick="ocultarConsulta(${c['ID']}, event)">✕</button>` : ''}
              <span class="toggle-icon">▼</span>
            </div>
          </div>
          <div class="consulta-body">
            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Comercial</div>
                <div class="dato-valor">${c['Nom comercial'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Correu</div>
                <div class="dato-valor">${c['Correu comercial'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Referència</div>
                <div class="dato-valor">${c['Referència'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Codi Client</div>
                <div class="dato-valor">${c['Codi client'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Material</div>
                <div class="dato-valor">${c['Material'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Mides</div>
                <div class="dato-valor">${c['Mides'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Qualitat</div>
                <div class="dato-valor">${c['Qualitat'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Nº Entregues</div>
                <div class="dato-valor">${c['Nº entregues'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Data Entrega</div>
                <div class="dato-valor">${c['Data entrega'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Competència</div>
                <div class="dato-valor">${c['Competència'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Comentaris</div>
                <div class="dato-valor">${c['Comentaris'] || '-'}</div>
              </div>
            </div>

            ${c['Assignat a'] ? `
              <div class="assignacio-section">
                <span class="assignacio-label">Assignat a: <strong>${c['Assignat a'].charAt(0).toUpperCase() + c['Assignat a'].slice(1)}</strong></span>
              </div>
            ` : `
              <div class="assignacio-section">
                <span class="assignacio-label">Assignar a:</span>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                  <button class="btn-asignar" onclick="asignar(${c['ID']}, 'nadia')">👤 Nadia</button>
                  <button class="btn-asignar" onclick="asignar(${c['ID']}, 'josep')">👤 Josep</button>
                  <button class="btn-asignar" onclick="asignar(${c['ID']}, 'fina')">👤 Fina</button>
                </div>
              </div>
            `}

            <div class="btn-group">
              <button class="btn btn-print" onclick="imprimir(${c['ID']})">🖨️ Imprimir</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // TOGGLE EXPANDIR
    function toggleExpandir(header) {
      const body = header.nextElementSibling;
      body.classList.toggle('expanded');
      const icon = header.querySelector('.toggle-icon');
      icon.textContent = body.classList.contains('expanded') ? '▲' : '▼';
    }

    // FILTRAR
    function filtrar(tab) {
      const inputElement = document.getElementById(`buscador-${tab}`);
      const input = (inputElement.value || '').toLowerCase().trim();

      console.log(`🔍 Buscando en ${tab}:`, input);

      let consultas;
      if (tab === 'sin-asignar') {
        consultas = todasLasConsultes.filter(c => !c['Assignat a'] || c['Assignat a'].trim() === '');
      } else {
        consultas = todasLasConsultes.filter(c => c['Assignat a'] && c['Assignat a'].trim() !== '').filter(c => !consultasOcultas.includes(c['ID']));
      }

      console.log(`📋 Total en ${tab}:`, consultas.length);

      // Si está vacío, mostrar todas
      if (!input) {
        mostrarConsultes(tab, consultas);
        return;
      }

      // Filtrar
      const filtradas = consultas.filter(c => {
        try {
          const ref = (c['Referència'] || '').toLowerCase();
          const comercial = (c['Nom comercial'] || '').toLowerCase();
          const cliente = (c['Nom client'] || '').toLowerCase();
          const id = String(c['ID'] || '').toLowerCase();
          
          return ref.includes(input) || comercial.includes(input) || cliente.includes(input) || id.includes(input);
        } catch(e) {
          console.error('Error filtrando consulta:', c, e);
          return false;
        }
      });

      console.log(`✅ Filtradas:`, filtradas.length);
      mostrarConsultes(tab, filtradas);
    }

    // ASIGNAR
    async function asignar(id, responsable) {
      try {
        await fetch(URL_SCRIPT, {
          method: 'POST',
          body: JSON.stringify({
            accio: 'asignar_consulta',
            id: id,
            responsable: responsable
          })
        });

        alert(`✅ Asignada a ${responsable.charAt(0).toUpperCase() + responsable.slice(1)}`);
        cargarConsultes();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    // OCULTAR CONSULTA
    function ocultarConsulta(id, event) {
      event.stopPropagation();
      if (!consultasOcultas.includes(id)) {
        consultasOcultas.push(id);
        localStorage.setItem('consultasOcultas', JSON.stringify(consultasOcultas));
        actualizarVistas();
      }
    }

    // IMPRIMIR
    function imprimir(id) {
      const consulta = todasLasConsultes.find(c => c['ID'] == id);
      if (!consulta) return;

      const ventana = window.open('', '', 'width=800,height=600');
      ventana.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Consulta #${id}</title>
          <style>
            body { font-family: Arial; padding: 20px; }
            h1 { color: #2E7E82; }
            .field { margin: 10px 0; }
            .label { font-weight: bold; color: #666; }
            @media print { button { display: none; } }
          </style>
        </head>
        <body>
          <h1>Consulta #${consulta['ID']}</h1>
          <div class="field"><span class="label">Client:</span> ${consulta['Nom client']}</div>
          <div class="field"><span class="label">Comercial:</span> ${consulta['Nom comercial']}</div>
          <div class="field"><span class="label">Referència:</span> ${consulta['Referència']}</div>
          <div class="field"><span class="label">Material:</span> ${consulta['Material']}</div>
          <div class="field"><span class="label">Mides:</span> ${consulta['Mides']}</div>
          <div class="field"><span class="label">Qualitat:</span> ${consulta['Qualitat']}</div>
          <div class="field"><span class="label">Nº Entregues:</span> ${consulta['Nº entregues']}</div>
          <div class="field"><span class="label">Data Entrega:</span> ${consulta['Data entrega']}</div>
          <div class="field"><span class="label">Comentaris:</span> ${consulta['Comentaris']}</div>
          <div class="field"><span class="label">Assignat a:</span> ${consulta['Assignat a'] || 'Sin asignar'}</div>
          <button onclick="window.print()">Imprimir</button>
        </body>
        </html>
      `);
      ventana.document.close();
    }

    // MOSTRAR TAB
    function mostrarTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');

      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');

      filtrar(tab);
    }

    // INICIAR
    cargarConsultes();
  </script>
</body>
</html>
