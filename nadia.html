<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Nadia - Farreras Nadal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --purple: #8B5CF6;
      --purple-light: #EDE9FE;
      --purple-dark: #6D28D9;
      --amber: #F59E0B;
      --amber-light: #FEF3C7;
      --grey-100: #F3F4F6;
      --grey-200: #E5E7EB;
      --grey-600: #4B5563;
      --grey-700: #374151;
      --red: #EF4444;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--grey-100);
      color: var(--grey-700);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      border-top: 4px solid var(--purple-dark);
    }

    .header-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--purple);
    }

    .counter {
      background: var(--amber-light);
      color: var(--amber);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      margin-top: 10px;
      display: inline-block;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--grey-200);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-light);
    }

    .consulta-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--purple);
    }

    .consulta-header {
      background: var(--grey-100);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 15px;
    }

    .consulta-header:hover {
      background: var(--grey-200);
    }

    .consulta-id {
      font-weight: 700;
      color: var(--purple);
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-eliminar {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-eliminar:hover {
      background: #DC2626;
    }

    .toggle-icon {
      font-weight: 700;
      color: var(--grey-600);
    }

    .consulta-body {
      padding: 20px;
      display: none;
    }

    .consulta-body.expanded {
      display: block;
    }

    .datos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .datos-grid.full {
      grid-template-columns: 1fr;
    }

    .dato-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--grey-200);
    }

    .dato-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--grey-600);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .dato-valor {
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-responder {
      background: var(--purple);
      color: white;
    }

    .btn-responder:hover {
      background: var(--purple-dark);
    }

    .btn-print {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid var(--amber);
    }

    .btn-print:hover {
      background: var(--amber);
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--grey-200);
      border-radius: 6px;
      font-family: inherit;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: var(--purple);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-submit {
      background: var(--purple);
      color: white;
    }

    .btn-cancel {
      background: var(--grey-200);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--grey-600);
    }

    @media print {
      .search-box, header, .btn-group, .btn-eliminar, .header-actions {
        display: none !important;
      }
      .consulta-body {
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-brand">👤 Nadia</div>
      <div class="counter" id="contador">0 consultes</div>
    </header>

    <div class="search-box">
      <input 
        type="text" 
        id="buscador" 
        placeholder="🔍 Cerca per: Referència, Comercial, Client o ID..." 
        lang="ca"
        onkeyup="filtrar()"
      >
    </div>

    <div id="llista"></div>
  </div>

  <div id="modalResposta" class="modal">
    <div class="modal-content">
      <div class="modal-header">Respondre Consulta #<span id="consultaID"></span></div>
      <div class="form-group">
        <label>Resposta</label>
        <textarea id="textResposta" placeholder="Escriu la teva resposta..." lang="ca" rows="6"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-submit" onclick="enviarResposta()">✉️ Enviar</button>
        <button class="btn-cancel" onclick="tancarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyGDLmEpL15VaolO6c4GjlmcZVERuG4zU6u_sO4BMLq8B9y4Nm3GD5uwK2CbJZBoKfZbQ/exec';
    const RESPONSABLE = 'nadia';
    let todasLasConsultes = [];
    let consultasEliminadas = JSON.parse(localStorage.getItem(`${RESPONSABLE}_eliminadas`)) || [];
    let consultaActual = null;

    async function cargarConsultes() {
      try {
        const response = await fetch(`${URL_SCRIPT}?responsable=${RESPONSABLE}`);
        const datos = await response.json();
        
        if (!Array.isArray(datos)) {
          throw new Error('Respuesta inválida');
        }

        todasLasConsultes = datos.sort((a, b) => {
          return new Date(b['Data entrada']) - new Date(a['Data entrada']);
        });

        mostrarConsultes();
      } catch (error) {
        document.getElementById('llista').innerHTML = `<div class="empty-state">❌ Error: ${error.message}</div>`;
      }
    }

    function filtrar() {
      const input = document.getElementById('buscador').value.toLowerCase().trim();
      
      let consultes = todasLasConsultes.filter(c => !consultasEliminadas.includes(c['ID']));

      if (!input) {
        mostrarConsultes(consultes);
        return;
      }

      const filtradas = consultes.filter(c => {
        const ref = (c['Referència'] || '').toLowerCase();
        const comercial = (c['Nom comercial'] || '').toLowerCase();
        const cliente = (c['Nom client'] || '').toLowerCase();
        const id = String(c['ID'] || '').toLowerCase();
        
        return ref.includes(input) || comercial.includes(input) || cliente.includes(input) || id.includes(input);
      });

      mostrarConsultes(filtradas);
    }

    function mostrarConsultes(consultes) {
      const llista = document.getElementById('llista');
      const activas = todasLasConsultes.filter(c => !consultasEliminadas.includes(c['ID']));

      document.getElementById('contador').textContent = `${activas.length} consultes`;

      if (!consultes) {
        consultes = activas;
      }

      if (consultes.length === 0) {
        llista.innerHTML = `<div class="empty-state">✅ No hi ha consultes</div>`;
        return;
      }

      llista.innerHTML = consultes.map(c => `
        <div class="consulta-card">
          <div class="consulta-header" onclick="toggleExpandir(this)">
            <div style="flex: 1;">
              <div style="display: flex; gap: 15px; align-items: baseline; flex-wrap: wrap;">
                <span style="font-weight: 600;">${c['Nom comercial'] || '-'}</span>
                <span style="color: var(--grey-600);">→</span>
                <span style="font-weight: 600;">${c['Nom client']}</span>
                <span style="color: var(--grey-500); font-size: 0.9rem;">[${c['Referència'] || '-'}]</span>
              </div>
            </div>
            <div class="header-actions">
              <button class="btn-eliminar" onclick="eliminarConsulta(${c['ID']}, event)">✕</button>
              <span class="toggle-icon">▼</span>
            </div>
          </div>
          <div class="consulta-body">
            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Comercial</div>
                <div class="dato-valor">${c['Nom comercial'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Correu</div>
                <div class="dato-valor">${c['Correu comercial'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Referència</div>
                <div class="dato-valor">${c['Referència'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Codi Client</div>
                <div class="dato-valor">${c['Codi client'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Material</div>
                <div class="dato-valor">${c['Material'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Mides</div>
                <div class="dato-valor">${c['Mides'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Qualitat</div>
                <div class="dato-valor">${c['Qualitat'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Nº Entregues</div>
                <div class="dato-valor">${c['Nº entregues'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid">
              <div class="dato-item">
                <div class="dato-label">Data Entrega</div>
                <div class="dato-valor">${c['Data entrega'] || '-'}</div>
              </div>
              <div class="dato-item">
                <div class="dato-label">Competència</div>
                <div class="dato-valor">${c['Competència'] || '-'}</div>
              </div>
            </div>

            <div class="datos-grid full">
              <div class="dato-item">
                <div class="dato-label">Comentaris</div>
                <div class="dato-valor">${c['Comentaris'] || '-'}</div>
              </div>
            </div>

            <div class="btn-group">
              <button class="btn btn-responder" onclick="abrirModalResposta(${c['ID']})">✉️ Respondre</button>
              <button class="btn btn-print" onclick="imprimir(${c['ID']})">🖨️ Imprimir</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleExpandir(header) {
      const body = header.nextElementSibling;
      body.classList.toggle('expanded');
      const icon = header.querySelector('.toggle-icon');
      icon.textContent = body.classList.contains('expanded') ? '▲' : '▼';
    }

    function eliminarConsulta(id, event) {
      event.stopPropagation();
      if (!consultasEliminadas.includes(id)) {
        consultasEliminadas.push(id);
        localStorage.setItem(`${RESPONSABLE}_eliminadas`, JSON.stringify(consultasEliminadas));
        mostrarConsultes();
      }
    }

    function abrirModalResposta(id) {
      consultaActual = id;
      document.getElementById('consultaID').textContent = id;
      document.getElementById('textResposta').value = '';
      document.getElementById('modalResposta').classList.add('active');
    }

    function tancarModal() {
      document.getElementById('modalResposta').classList.remove('active');
      consultaActual = null;
    }

    async function enviarResposta() {
      const resposta = document.getElementById('textResposta').value.trim();
      
      if (!resposta) {
        alert('⚠️ Escriu una resposta');
        return;
      }

      try {
        const payload = {
          accio: 'resposta_responsable',
          id: consultaActual,
          responsable: RESPONSABLE,
          comentari: resposta
        };

        const response = await fetch(URL_SCRIPT, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        
        if (result.succes || result.success) {
          alert('✅ Resposta enviada!');
          
          // ELIMINAR CONSULTA DEL PORTAL DESPUÉS DE RESPONDER
          if (!consultasEliminadas.includes(consultaActual)) {
            consultasEliminadas.push(consultaActual);
            localStorage.setItem(`${RESPONSABLE}_eliminadas`, JSON.stringify(consultasEliminadas));
          }
          
          tancarModal();
          cargarConsultes();
        } else {
          alert('❌ Error: ' + (result.error || 'Unknown error'));
        }
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    function imprimir(id) {
      const consulta = todasLasConsultes.find(c => c['ID'] == id);
      if (!consulta) return;

      const ventana = window.open('', '', 'width=800,height=600');
      ventana.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Consulta #${id}</title>
          <style>
            body { font-family: Arial; padding: 20px; }
            h1 { color: #8B5CF6; }
            .field { margin: 10px 0; }
            .label { font-weight: bold; }
          </style>
        </head>
        <body>
          <h1>Consulta #${consulta['ID']}</h1>
          <div class="field"><span class="label">Client:</span> ${consulta['Nom client']}</div>
          <div class="field"><span class="label">Comercial:</span> ${consulta['Nom comercial']}</div>
          <div class="field"><span class="label">Referència:</span> ${consulta['Referència']}</div>
          <div class="field"><span class="label">Material:</span> ${consulta['Material']}</div>
          <div class="field"><span class="label">Mides:</span> ${consulta['Mides']}</div>
          <div class="field"><span class="label">Qualitat:</span> ${consulta['Qualitat']}</div>
          <div class="field"><span class="label">Nº Entregues:</span> ${consulta['Nº entregues']}</div>
          <div class="field"><span class="label">Data Entrega:</span> ${consulta['Data entrega']}</div>
          <div class="field"><span class="label">Comentaris:</span> ${consulta['Comentaris']}</div>
          <button onclick="window.print()">Imprimir</button>
        </body>
        </html>
      `);
      ventana.document.close();
    }

    cargarConsultes();
  </script>
</body>
</html>
