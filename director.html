<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Director – Farreras Nadal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    :root { --page-accent: var(--primary); }

    .assign-group { display: flex; gap: .375rem; flex-wrap: wrap; }

    .stat-card.pendent  { border-top: 3px solid var(--amber); }
    .stat-card.respost  { border-top: 3px solid var(--green); }
    .stat-card.assignat { border-top: 3px solid var(--purple); }
    .stat-card.total    { border-top: 3px solid var(--primary); }

    .consulta-card { border-left: 3px solid var(--grey-200); }
    .consulta-card.assignat-nadia { border-left-color: var(--purple); }
    .consulta-card.assignat-josep { border-left-color: var(--pink); }
    .consulta-card.assignat-fina  { border-left-color: var(--cyan); }

    /* filter row */
    .filter-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: .375rem;
      padding: .35rem .8rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
      border: 1.5px solid var(--grey-200); background: var(--white); color: var(--grey-600);
      cursor: pointer; transition: all var(--transition);
    }
    .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
    .filter-chip.active { background: var(--primary); border-color: var(--primary); color: var(--white); }
  </style>
</head>
<body class="page-wrapper">

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <a href="#" class="logo">
      <div class="logo-icon">FN</div>
      <div class="logo-text">
        <strong>Farreras Nadal</strong>
        <span>Panel Director</span>
      </div>
    </a>
    <div class="header-user">
      <div class="avatar" style="background:var(--primary-dark)">D</div>
      <span>Director</span>
    </div>
  </div>
</header>

<main class="main-content">
  <div class="container">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card pendent">
        <div class="stat-value" style="color:var(--amber)" id="sPendent">—</div>
        <div class="stat-label">Pendents</div>
      </div>
      <div class="stat-card assignat">
        <div class="stat-value" style="color:var(--purple)" id="sAssignat">—</div>
        <div class="stat-label">Assignades</div>
      </div>
      <div class="stat-card respost">
        <div class="stat-value" style="color:var(--green)" id="sRespost">—</div>
        <div class="stat-label">Respostes</div>
      </div>
      <div class="stat-card total">
        <div class="stat-value" style="color:var(--primary)" id="sTotal">—</div>
        <div class="stat-label">Total</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="section-header">
      <div data-tab-group="main" style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
        <div class="tabs-bar">
          <button class="tab-btn active" data-tab="tabPendent">
            🔴 Sense assignar <span class="tab-badge" id="badgePendent">0</span>
          </button>
          <button class="tab-btn" data-tab="tabAssignat">
            🟣 Assignades <span class="tab-badge" id="badgeAssignat">0</span>
          </button>
          <button class="tab-btn" data-tab="tabRespost">
            ✅ Respostes <span class="tab-badge" id="badgeRespost">0</span>
          </button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" id="btnRefresh">↻ Actualitzar</button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar…" />
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-content active" id="tabPendent" data-tab-group="main">
      <div id="listPendent" class="consulta-list">
        <div class="loading-state"><div class="spinner"></div>Carregant…</div>
      </div>
    </div>
    <div class="tab-content" id="tabAssignat" data-tab-group="main">
      <div id="listAssignat" class="consulta-list">
        <div class="loading-state"><div class="spinner"></div>Carregant…</div>
      </div>
    </div>
    <div class="tab-content" id="tabRespost" data-tab-group="main">
      <div id="listRespost" class="consulta-list">
        <div class="loading-state"><div class="spinner"></div>Carregant…</div>
      </div>
    </div>

  </div>
</main>

<!-- Modal: Respondre -->
<div class="modal-backdrop" id="modalRespond">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">✏️ Respondre consulta</h3>
      <button class="modal-close" onclick="closeModal('modalRespond')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:1rem">
        <label>Resposta <span class="req">*</span></label>
        <textarea id="respondText" rows="5" placeholder="Escriu la resposta per al comercial…"></textarea>
      </div>
      <div class="form-group">
        <label>Arxiu adjunt (opcional)</label>
        <div class="file-upload-area" id="uploadRespond">
          <input type="file" id="fileInputRespond" multiple
            accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.xls,.xlsx,.txt" />
          <div class="file-upload-icon">📂</div>
          <div class="file-upload-label"><strong>Fes clic o arrossega</strong> per adjuntar</div>
          <div class="file-upload-hint">Màx. 10 MB per arxiu</div>
          <div class="file-list"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalRespond')">Cancel·lar</button>
      <button class="btn btn-primary" id="btnSendRespond">Enviar resposta</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
<script>
  let allRows = [];
  let respondingId = null;

  // ── Load ──────────────────────────────────────────────────
  async function load() {
    try {
      const data = await apiGet({ correu: 'director' });
      allRows = Array.isArray(data) ? data : (data.rows || []);
      render();
    } catch(err) {
      ['listPendent','listAssignat','listRespost'].forEach(id =>
        document.getElementById(id).innerHTML = errHtml(err.message));
    }
  }

  function render() {
    const hidden   = getHidden('director-hidden');
    const rows     = allRows.filter(r => !hidden.includes(String(r.id))).reverse();
    const pendent  = rows.filter(r => !r.assignat && (r.estat||'').toLowerCase() !== 'respos');
    const assignat = rows.filter(r => r.assignat  && (r.estat||'').toLowerCase() !== 'respos');
    const respost  = rows.filter(r => (r.estat||'').toLowerCase() === 'respos');

    document.getElementById('sPendent').textContent   = pendent.length;
    document.getElementById('sAssignat').textContent  = assignat.length;
    document.getElementById('sRespost').textContent   = respost.length;
    document.getElementById('sTotal').textContent     = rows.length;
    document.getElementById('badgePendent').textContent  = pendent.length;
    document.getElementById('badgeAssignat').textContent = assignat.length;
    document.getElementById('badgeRespost').textContent  = respost.length;

    document.getElementById('listPendent').innerHTML   = pendent.length
      ? pendent.map(r => cardHtml(r, 'pendent')).join('') : emptyHtml('cap consulta sense assignar', '🔴');
    document.getElementById('listAssignat').innerHTML  = assignat.length
      ? assignat.map(r => cardHtml(r, 'assignat')).join('') : emptyHtml('cap consulta assignada', '🟣');
    document.getElementById('listRespost').innerHTML   = respost.length
      ? respost.map(r => cardHtml(r, 'respost')).join('') : emptyHtml('cap resposta', '✅');

    applySearch();
  }

  function cardHtml(r, mode) {
    const assignatCls = r.assignat ? `assignat-${r.assignat}` : '';
    const arxiusCom  = arxiusHtml(r.arxius, 'Arxius del comercial');
    const arxiusResp = arxiusHtml(r.arxius_resposta, 'Arxius de resposta');
    const respostaSec = r.comentari_intern ? `
      <div class="resposta-box">
        <div class="resposta-label">📨 Resposta enviada</div>
        <div class="resposta-text">${escHtml(r.comentari_intern)}</div>
      </div>` : '';

    const actionsHtml = mode !== 'respost' ? `
      <div class="consulta-actions">
        <button class="btn btn-sm btn-primary" onclick="startRespond(${r.id})">✏️ Respondre</button>
        <div class="assign-group">
          <button class="btn btn-sm btn-purple" onclick="assignar(${r.id},'nadia')">Nadia</button>
          <button class="btn btn-sm btn-pink"   onclick="assignar(${r.id},'josep')">Josep</button>
          <button class="btn btn-sm btn-cyan"   onclick="assignar(${r.id},'fina')">Fina</button>
        </div>
        <button class="btn btn-sm btn-amber" onclick="printCard(${r.id})">🖨️ Imprimir</button>
      </div>` : `
      <div class="consulta-actions">
        <button class="btn btn-sm btn-amber" onclick="printCard(${r.id})">🖨️ Imprimir</button>
      </div>`;

    return `
    <div class="consulta-card ${assignatCls}" id="card-${r.id}">
      <div class="consulta-card-header">
        <span class="consulta-id">#${val(r.id)}</span>
        <div class="consulta-info">
          <div class="consulta-ref">${val(r.referencia)} — ${val(r.nom_client)}</div>
          <div class="consulta-meta">
            <span>👤 ${val(r.nom_comercial)}</span>
            <span>📅 ${formatDate(r.data_entrada)}</span>
            <span>📋 ${val(r.tipus)}</span>
          </div>
        </div>
        <div class="consulta-badges">${badgeHtml(r)}</div>
        <span class="consulta-chevron">▼</span>
        <button class="card-hide-btn" onclick="event.stopPropagation();hideCard(${r.id})" title="Eliminar consulta">✕</button>
      </div>
      <div class="consulta-card-body">
        ${detailGrid([
          ['Comercial', r.nom_comercial],
          ['Correu', r.correu_comercial],
          ['Referència', r.referencia],
          ['Codi client', r.codi_client],
          ['Nom client', r.nom_client],
          ['Data consulta', formatDate(r.data_consulta)],
          ['Tipus', r.tipus],
          ['Material', r.material],
          ['Mides', r.mides],
          ['Qualitat', r.qualitat],
          ['Nº entregues', r.entregues],
          ['Data entrega', formatDate(r.data_entrega)],
          ['Competència', r.competencia],
          ['Assignat a', r.assignat ? cap(r.assignat) : '—'],
          ['Estat', r.estat],
          ['Dies resposta', r.dies_resposta],
        ])}
        ${r.comentaris ? `<div class="consulta-comentari">${escHtml(r.comentaris)}</div>` : ''}
        ${arxiusCom}
        ${respostaSec}
        ${arxiusResp}
        ${actionsHtml}
      </div>
    </div>`;
  }

  // ── Actions ───────────────────────────────────────────────
  function startRespond(id) {
    respondingId = id;
    document.getElementById('respondText').value = '';
    fileStores['uploadRespond'] = [];
    const area = document.getElementById('uploadRespond');
    const list = area?.querySelector('.file-list');
    if (list) list.innerHTML = '';
    openModal('modalRespond');
  }

  document.getElementById('btnSendRespond').addEventListener('click', async () => {
    const text = document.getElementById('respondText').value.trim();
    if (!text) { showToast('Cal escriure una resposta.', 'error'); return; }
    const btn = document.getElementById('btnSendRespond');
    btn.disabled = true; btn.classList.add('btn-loading');
    try {
      const arxius = await getFilesAsBase64('uploadRespond');
      const res = await apiPost({
        accio: 'resposta_director',
        id: respondingId,
        comentari: text,
        arxius,
      });
      if (res.ok) {
        showToast('Resposta enviada!', 'success');
        closeModal('modalRespond');
        load();
      } else throw new Error(res.error || 'Error');
    } catch(err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.classList.remove('btn-loading');
    }
  });

  async function assignar(id, responsable) {
    try {
      const res = await apiPost({ accio: 'asignar_consulta', id, responsable });
      if (res.ok) { showToast(`Consulta assignada a ${cap(responsable)}!`, 'success'); load(); }
      else throw new Error(res.error || 'Error');
    } catch(err) { showToast('Error: ' + err.message, 'error'); }
  }

  function hideCard(id) {
    hideItem('director-hidden', String(id));
    const card = document.getElementById(`card-${id}`);
    if (card) card.remove();
    render();
  }

  function printCard(id) {
    const card = document.getElementById(`card-${id}`);
    if (!card) return;
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head>
      <title>Consulta #${id} — Farreras Nadal</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="shared.css" />
      </head><body style="padding:2rem">
      <h2 style="margin-bottom:1.5rem">Farreras Nadal — Consulta #${id}</h2>
      ${card.querySelector('.consulta-card-body').innerHTML}
      </body></html>`);
    w.document.close();
    w.print();
  }

  // ── Helpers ───────────────────────────────────────────────
  function emptyHtml(text, icon) {
    return `<div class="empty-state"><div class="empty-state-icon">${icon}</div>
      <h3>No hi ha ${text}</h3><p>Les consultes apareixeran aquí automàticament.</p></div>`;
  }
  function errHtml(msg) {
    return `<div class="empty-state"><div class="empty-state-icon">⚠️</div>
      <h3>Error</h3><p>${escHtml(msg)}</p></div>`;
  }

  // ── Init ─────────────────────────────────────────────────
  initFileUpload('uploadRespond');
  initSearch('searchInput');
  document.getElementById('btnRefresh').addEventListener('click', load);
  load();
  setInterval(load, 30000);
</script>

</body>
</html>
